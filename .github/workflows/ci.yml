name: CI/CD Pipeline

on: 
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch: {}

jobs:
  format-lint-test:
    name: Format, Lint and Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check code formatting with Ruff
        run: ruff format --check
      - name: Lint code with Ruff
        run: ruff check --exit-non-zero-on-fix
      - name: Test with pytest
        env:
          ENVIRONMENT: os
          CORS_ALLOWED_ORIGINS: http://127.0.0.1/,https://www.google.com/,https://fastapi.tiangolo.com/
          SECRET_KEY: githubtest
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 1440
          REFRESH_TOKEN_EXPIRE_MINUTES: 2880
          TZ: Asia/Jakarta
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_PASSWORD: postgres
          POSTGRES_DATABASE: postgres
          POSTGRES_USER: postgres
        run: |
          alembic upgrade head
          pytest . -n auto

  docker-build:
    name: Build Docker Image
    needs: format-lint-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      IMAGE_NAME: ${{ github.ref_name == 'dev' && 'pyconid26-be-dev' || 'pyconid26-be-prod' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat version.txt)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login "$REGISTRY" -u "$GHCR_USERNAME" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t "$REGISTRY/$GHCR_USERNAME/$IMAGE_NAME:${{ steps.version.outputs.version }}" \
            .

      - name: Push Docker image
        run: docker push "$REGISTRY/$GHCR_USERNAME/$IMAGE_NAME:${{ steps.version.outputs.version }}"

      - name: Remove local Docker image
        if: always()
        run: docker image rm "$REGISTRY/$GHCR_USERNAME/$IMAGE_NAME:${{ steps.version.outputs.version }}" || true

      - name: Logout Docker
        if: always()
        run: docker logout "$REGISTRY"

  deploy-dev:
    name: Deploy to Development
    needs: [docker-build]
    if: ${{ github.ref_name == 'dev' }}
    runs-on: [self-hosted]
    environment:
      name: development
      url: https://2026-api-dev.pycon.id/
    env:
      DEPLOY_DIR: /home/pycon/pyconid26-be-dev
      REGISTRY: ghcr.io
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      IMAGE_NAME: pyconid26-be-dev

    steps:
      - uses: actions/checkout@v4

      - name: Sync docker-compose.yaml and version.txt to deploy dir
        run: |
          mkdir -p "$DEPLOY_DIR"
          cp docker-compose.yaml version.txt "$DEPLOY_DIR"/

      - name: Sync image coordinates into server .env and deploy
        run: |
          cd "$DEPLOY_DIR"
          touch .env

          upsert_env() {
            if grep -q "^$1=" .env; then
              sed -i "s|^$1=.*|$1=$2|" .env
            else
              echo "$1=$2" >> .env
            fi
          }

          upsert_env REGISTRY "$REGISTRY"
          upsert_env GHCR_USERNAME "$GHCR_USERNAME"
          upsert_env IMAGE_NAME "$IMAGE_NAME"
          upsert_env IMAGE_TAG "$(cat version.txt)"

          echo "${{ secrets.GHCR_TOKEN }}" | docker login "$REGISTRY" -u "$GHCR_USERNAME" --password-stdin

          docker compose --env-file .env pull
          docker compose --env-file .env up -d --force-recreate

      - name: Logout Docker
        if: always()
        run: docker logout "$REGISTRY"

  deploy-prod:
    name: Deploy to Production
    needs: [docker-build]
    if: ${{ github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: [self-hosted, linux]
    environment:
      name: production
      url: https://2026-api.pycon.id/
    env:
      DEPLOY_DIR: /home/pycon/pyconid26-be-prod
      REGISTRY: ghcr.io
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      IMAGE_NAME: pyconid26-be-prod

    steps:
      - uses: actions/checkout@v4

      - name: Sync docker-compose.yaml and version.txt to deploy dir
        run: |
          mkdir -p "$DEPLOY_DIR"
          cp docker-compose.yaml version.txt "$DEPLOY_DIR"/

      - name: Sync image coordinates into server .env and deploy
        run: |
          cd "$DEPLOY_DIR"
          touch .env

          upsert_env() {
            if grep -q "^$1=" .env; then
              sed -i "s|^$1=.*|$1=$2|" .env
            else
              echo "$1=$2" >> .env
            fi
          }

          upsert_env REGISTRY "$REGISTRY"
          upsert_env GHCR_USERNAME "$GHCR_USERNAME"
          upsert_env IMAGE_NAME "$IMAGE_NAME"
          upsert_env IMAGE_TAG "$(cat version.txt)"

          echo "${{ secrets.GHCR_TOKEN }}" | docker login "$REGISTRY" -u "$GHCR_USERNAME" --password-stdin

          docker compose --env-file .env pull
          docker compose --env-file .env up -d --force-recreate

      - name: Logout Docker
        if: always()
        run: docker logout "$REGISTRY"